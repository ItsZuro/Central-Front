name: Frontend CI

on:
  push:
    branches: [main, feature/cloud-final-project, 'feat/admin-*']
  pull_request:
    branches: [main, feature/cloud-final-project]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Ejecutar pruebas automatizadas
        run: npm test

      - name: Compilar para producción
        run: npm run build

  container:
    name: Imagen Docker y health check
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Construir imagen Docker
        run: docker build --tag central-front:ci .

      - name: Iniciar contenedor
        run: docker run --detach --name central-front-ci --publish 8080:80 central-front:ci

      - name: Comprobar estado del frontend
        run: curl --retry 10 --retry-delay 2 --retry-all-errors --fail --silent --show-error http://localhost:8080/health

      - name: Eliminar contenedor de validación
        if: always()
        continue-on-error: true
        run: docker rm --force central-front-ci

  aws-deploy:
    name: Desplegar en AWS solo despues de CI y health check
    needs: [quality, container]
    if: github.ref == 'refs/heads/feature/cloud-final-project' && github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar variable de Google Maps para CloudFront
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$VITE_GOOGLE_MAPS_API_KEY" ]; then
            echo "::error::Configura VITE_GOOGLE_MAPS_API_KEY en Central-Front / Settings / Secrets and variables / Actions / Variables"
            exit 1
          fi

      - name: Compilar frontend
        env:
          VITE_API_BASE_URL: https://d3gjtcfgv1ut3w.cloudfront.net/api/v1/
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Autenticarse en AWS mediante GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::431223004152:role/central-github-frontend-deploy-role
          aws-region: us-east-1

      - name: Publicar archivos en S3
        run: |
          aws s3 sync dist/ s3://restaurant-central-frontend-431223004152-us-east-1-an/ --delete --cache-control "public,max-age=300"
          aws s3 cp dist/index.html s3://restaurant-central-frontend-431223004152-us-east-1-an/index.html --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html"

      - name: Invalidar cache de CloudFront
        run: aws cloudfront create-invalidation --distribution-id ES35UH1I1548V --paths "/*"
