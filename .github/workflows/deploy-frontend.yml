name: Deploy React to S3 + CloudFront

on:
  push:
    branches: [feature/cloud-final-project]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-restaurant-central-frontend
  cancel-in-progress: false

jobs:
  deploy:
    # Activar SOLO después de configurar el rol OIDC y las variables de repositorio.
    if: ${{ vars.ENABLE_FRONTEND_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build frontend for AWS
        env:
          VITE_API_BASE_URL: https://d3gjtcfgv1ut3w.cloudfront.net/api/v1/
        run: npm run build

      - name: Authenticate with AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: restaurant-central-frontend-${{ github.run_id }}

      - name: Validate deployment configuration
        env:
          BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
          DISTRIBUTION: ${{ vars.FRONTEND_CF_DISTRIBUTION_ID }}
        run: |
          test -n "$BUCKET" || (echo "Falta FRONTEND_S3_BUCKET" >&2; exit 1)
          test -n "$DISTRIBUTION" || (echo "Falta FRONTEND_CF_DISTRIBUTION_ID" >&2; exit 1)

      - name: Publish static assets
        env:
          BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
        run: |
          # Se presupone que el bucket está dedicado al frontend.
          aws s3 sync dist/ "s3://$BUCKET/" --delete --exclude "index.html"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html"

      - name: Invalidate frontend CloudFront
        env:
          DISTRIBUTION: ${{ vars.FRONTEND_CF_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*'
