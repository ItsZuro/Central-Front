name: One-time Mantine dependency bootstrap

on:
  push:
    paths:
      - .github/workflows/mantine-bootstrap.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cloud-final-project
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Mantine 8 compatible with React 18
        run: npm install --save-exact @mantine/core@8.3.18 @mantine/hooks@8.3.18
      - name: Commit package manifest and lock file
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(frontend): install Mantine v8 for React 18"
            git push origin HEAD:feature/cloud-final-project
          fi
